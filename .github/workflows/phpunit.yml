name: PHPUnit

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: xdebug
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer coverage
      - name: Verificar cobertura mínima de 80%
        run: |
          php -r '$xml = simplexml_load_file("coverage/clover.xml"); $metrics = $xml->project->metrics; $total = (int) $metrics["statements"]; $covered = (int) $metrics["coveredstatements"]; $percent = $total > 0 ? 100 * $covered / $total : 0; printf("Cobertura: %.2f%%\n", $percent); exit($percent >= 80 ? 0 : 1);'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-phpunit
          path: coverage/
